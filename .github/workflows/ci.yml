name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la imagen de tests del backend
        uses: docker/build-push-action@v7
        with:
          context: ./app/backend
          target: test
          load: true
          push: false
          tags: backend-test:ci
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      - name: Ejecutar tests y cobertura del backend
        run: |
          mkdir -p "$RUNNER_TEMP/backend-results"
          docker run --rm \
            --mount "type=bind,source=$RUNNER_TEMP/backend-results,target=/out" \
            backend-test:ci

      - name: Publicar resumen de cobertura del backend
        if: ${{ !cancelled() }}
        env:
          PROJECT: Backend
          COVERAGE_REPORT: ${{ runner.temp }}/backend-results/coverage/coverage-summary.json
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { PROJECT, COVERAGE_REPORT, GITHUB_STEP_SUMMARY } = process.env;
          try {
            const { total } = JSON.parse(fs.readFileSync(COVERAGE_REPORT, 'utf8'));
            const rows = [['Líneas', total.lines], ['Ramas', total.branches]].map(([name, metric]) => {
              if (![metric.pct, metric.covered, metric.total].every(Number.isFinite)) {
                throw new Error(`Métrica inválida: ${name}`);
              }
              return `| ${name} | ${metric.pct}% | ${metric.covered}/${metric.total} |`;
            });
            fs.appendFileSync(GITHUB_STEP_SUMMARY,
              `### Cobertura ${PROJECT}\n\n| Métrica | Porcentaje | Cubiertos/total |\n| --- | ---: | ---: |\n${rows.join('\n')}\n`);
          } catch (error) {
            const message = `${PROJECT}: no se pudo leer un reporte de cobertura válido en ${COVERAGE_REPORT}: ${error.message}`;
            fs.appendFileSync(GITHUB_STEP_SUMMARY, `### Cobertura ${PROJECT}\n\n${message}\n`);
            console.error(message);
            process.exitCode = 1;
          }
          NODE

      - name: Publicar reporte completo del backend
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: ${{ runner.temp }}/backend-results/coverage/
          if-no-files-found: error

      - name: Entrar al registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: ./app/backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/vargass21/ingsoft3-tp01-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la imagen de tests del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./app/frontend
          target: test
          load: true
          push: false
          tags: frontend-test:ci
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test

      - name: Ejecutar tests y cobertura del frontend
        run: |
          mkdir -p "$RUNNER_TEMP/frontend-results"
          docker run --rm \
            --mount "type=bind,source=$RUNNER_TEMP/frontend-results,target=/out" \
            frontend-test:ci

      - name: Publicar resumen de cobertura del frontend
        if: ${{ !cancelled() }}
        env:
          PROJECT: Frontend
          COVERAGE_REPORT: ${{ runner.temp }}/frontend-results/coverage/coverage-summary.json
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { PROJECT, COVERAGE_REPORT, GITHUB_STEP_SUMMARY } = process.env;
          try {
            const { total } = JSON.parse(fs.readFileSync(COVERAGE_REPORT, 'utf8'));
            const rows = [['Líneas', total.lines], ['Ramas', total.branches]].map(([name, metric]) => {
              if (![metric.pct, metric.covered, metric.total].every(Number.isFinite)) {
                throw new Error(`Métrica inválida: ${name}`);
              }
              return `| ${name} | ${metric.pct}% | ${metric.covered}/${metric.total} |`;
            });
            fs.appendFileSync(GITHUB_STEP_SUMMARY,
              `### Cobertura ${PROJECT}\n\n| Métrica | Porcentaje | Cubiertos/total |\n| --- | ---: | ---: |\n${rows.join('\n')}\n`);
          } catch (error) {
            const message = `${PROJECT}: no se pudo leer un reporte de cobertura válido en ${COVERAGE_REPORT}: ${error.message}`;
            fs.appendFileSync(GITHUB_STEP_SUMMARY, `### Cobertura ${PROJECT}\n\n${message}\n`);
            console.error(message);
            process.exitCode = 1;
          }
          NODE

      - name: Publicar reporte completo del frontend
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: ${{ runner.temp }}/frontend-results/coverage/
          if-no-files-found: error

      - name: Entrar al registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./app/frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/vargass21/ingsoft3-tp01-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend


  deploy-qa:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: qa
      url: https://minireservas-front-qa.onrender.com
    permissions:
      contents: read
    steps:
      - name: Desplegar en QA las imagenes del commit verificado
        shell: bash
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_QA }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_QA }}
        run: |
          if [[ -z "$HOOK_API" || -z "$HOOK_FRONT" ]]; then
            echo "Falta configurar un deploy hook en el environment qa."
            exit 1
          fi
          IMG_API="ghcr.io/vargass21/ingsoft3-tp01-backend:sha-$GITHUB_SHA"
          IMG_FRONT="ghcr.io/vargass21/ingsoft3-tp01-frontend:sha-$GITHUB_SHA"
          echo "QA backend: $IMG_API"
          echo "QA frontend: $IMG_FRONT"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"

      - name: Smoke test QA con reintentos
        shell: bash
        env:
          URL_API: https://minireservas-api-qa.onrender.com
          URL_FRONT: https://minireservas-front-qa.onrender.com
        run: |
          for i in $(seq 1 30); do
            echo "Comprobando QA: intento $i de 30"
            if curl -fsS --max-time 10 "$URL_API/api/health" \
               && curl -fsS --max-time 10 "$URL_API/api/rooms" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/api/rooms" > /dev/null; then
              echo "QA responde: API, base, frontend y proxy."
              exit 0
            fi
            sleep 20
          done
          echo "QA no respondio dentro de los intentos permitidos."
          exit 1

  integracion:
    runs-on: ubuntu-latest
    needs: deploy-qa
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: Instalar dependencias sin navegador
        run: npm ci
        working-directory: ./app/frontend
      - name: Integracion contra la API de QA
        env:
          API_BASE_URL: https://minireservas-api-qa.onrender.com
        run: npx playwright test e2e/api.spec.js
        working-directory: ./app/frontend
      - name: Publicar reporte de integracion
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-integracion
          path: app/frontend/playwright-report
          if-no-files-found: error
          retention-days: 30

  e2e:
    runs-on: ubuntu-latest
    needs: integracion
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: Instalar dependencias y Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: ./app/frontend
      - name: E2E contra el frontend de QA
        env:
          E2E_BASE_URL: https://minireservas-front-qa.onrender.com
        run: npx playwright test e2e/salas.spec.js
        working-directory: ./app/frontend
      - name: Publicar reporte e2e
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-e2e
          path: app/frontend/playwright-report
          if-no-files-found: error
          retention-days: 30

  deploy-prod:
    runs-on: ubuntu-latest
    needs: e2e
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    environment:
      name: production
      url: https://minireservas-front-prod.onrender.com
    permissions:
      contents: read
    steps:
      - name: Desplegar en PROD las mismas imagenes verificadas en QA
        shell: bash
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_PROD }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_PROD }}
        run: |
          if [[ -z "$HOOK_API" || -z "$HOOK_FRONT" ]]; then
            echo "Falta configurar un deploy hook en el environment production."
            exit 1
          fi
          IMG_API="ghcr.io/vargass21/ingsoft3-tp01-backend:sha-$GITHUB_SHA"
          IMG_FRONT="ghcr.io/vargass21/ingsoft3-tp01-frontend:sha-$GITHUB_SHA"
          echo "PROD backend: $IMG_API"
          echo "PROD frontend: $IMG_FRONT"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"

      - name: Smoke test PROD con reintentos
        shell: bash
        env:
          URL_API: https://minireservas-api-prod.onrender.com
          URL_FRONT: https://minireservas-front-prod.onrender.com
        run: |
          for i in $(seq 1 30); do
            echo "Comprobando PROD: intento $i de 30"
            if curl -fsS --max-time 10 "$URL_API/api/health" \
               && curl -fsS --max-time 10 "$URL_API/api/rooms" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/api/rooms" > /dev/null; then
              echo "PROD responde: API, base, frontend y proxy."
              exit 0
            fi
            sleep 20
          done
          echo "PROD no respondio dentro de los intentos permitidos."
          exit 1
