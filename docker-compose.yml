services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: minireservas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app/backend/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d minireservas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
